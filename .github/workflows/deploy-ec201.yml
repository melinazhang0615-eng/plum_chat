name: Deploy EC201

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ec201

    steps:
      - name: Deploy frontend to EC201
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /opt/workspace/plum_chat

            git fetch origin
            git checkout main
            git pull --ff-only origin main

            export PATH="/home/ubuntu/.nvm/versions/node/v22.23.2/bin:/usr/bin:/bin:$PATH"
            NPM="/home/ubuntu/.nvm/versions/node/v22.23.2/bin/npm"

            "$NPM" ci
            PLUM_API_ORIGIN=http://127.0.0.1:8180 "$NPM" run build

            systemctl --user restart plum-chat-frontend.service
            systemctl --user status plum-chat-frontend.service --no-pager -n 50

            sleep 2
            curl -fsS http://127.0.0.1:3000/ -o /dev/null

            echo "Deployment successful"
