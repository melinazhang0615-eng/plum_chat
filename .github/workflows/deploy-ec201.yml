name: Test EC201 Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ec201

    steps:
      - name: Update code on EC201
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /opt/workspace/plum_chat

            echo "Before:"
            git rev-parse --short HEAD

            git fetch origin
            git checkout main
            git pull --ff-only origin main

            echo "After:"
            git rev-parse --short HEAD

            git status
